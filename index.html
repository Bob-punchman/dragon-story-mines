<script>
/*
 * Mines Solver for Dragon Story
 * Version 2026.11.26-2 (wiki)
 *
 * Draws the solver inside <div id="mines-solver"></div> on a wiki page.
 * Does nothing on pages without that element.
 *
 * Optional: data-bg="URL" on the div sets the background picture of the grid,
 * e.g. <div id="mines-solver" data-bg="{{filepath:Mines solver background.jpg}}"></div>
 *
 * Written in plain ES5 (var/function) so it works with any script validator.
 * Source / standalone version: https://bob-punchman.github.io/dragon-story-mines/
 */
(function () {
  'use strict';

  var ROWS = 7, COLS = 10;
  var COL_LABELS = 'ABCDEFGHIJ';
  var TOP_K = 6;       // how many digs the look-ahead follows at each step
  var VERSION = '2026.11.26-2';
  var SIDE_WIDTH = 170; // width of the column with suggestion + buttons
  var MIN_SIDE_CELL = 40; // side by side only if cells stay at least this big
  var MAX_CELL = 60;

  // ---------- Styles (everything starts with #mines-solver) ----------
  var CSS = [
    '#mines-solver{--ms-gold:#c8922a;--ms-gold-light:#f0c060;--ms-near:#e8a020;--ms-close:#40c060;',
    '--ms-stone:#2a2018;--ms-text:#d4b870;--ms-dim:#9a8060;--ms-border:#4a3820;--ms-blue:#5a8aff;--ms-panel:#1a1208;',
    '--ms-c:40px;--ms-l:24px;',
    'color:var(--ms-text);background:#0d0a06;border-radius:10px;padding:14px;font-family:inherit;line-height:1.4;}',
    '#mines-solver *{box-sizing:border-box;}',
    '#mines-solver .ms-top{text-align:center;color:var(--ms-gold);font-weight:bold;letter-spacing:1px;margin-bottom:10px;}',
    '#mines-solver .ms-version{color:var(--ms-dim);font-weight:normal;font-size:0.8em;}',
    // switch between the two kinds of percentages
    '#mines-solver .ms-view{text-align:center;margin:-4px 0 10px 0;font-size:0.85em;color:var(--ms-dim);}',
    '#mines-solver .ms-view button{padding:3px 10px;margin:0 3px;border-color:var(--ms-border);background:var(--ms-stone);color:var(--ms-dim);}',
    '#mines-solver .ms-view button.active{border-color:var(--ms-blue);background:#0a0e1c;color:var(--ms-blue);}',
    '#mines-solver .ms-prob.no-loot{color:#a03030;}',
    // main row: grid + side column; .stacked puts the side column under the grid
    '#mines-solver .ms-main{display:flex;gap:14px;align-items:flex-start;justify-content:center;}',
    '#mines-solver .ms-side{width:' + SIDE_WIDTH + 'px;display:flex;flex-direction:column;gap:10px;}',
    '#mines-solver .ms-main.stacked{flex-direction:column;align-items:center;}',
    '#mines-solver .ms-main.stacked .ms-side{width:100%;}',
    '#mines-solver .ms-main.stacked .ms-buttons{flex-direction:row;flex-wrap:wrap;}',
    '#mines-solver .ms-main.stacked .ms-buttons button{flex:1 1 30%;}',
    '#mines-solver .ms-panel{background:var(--ms-panel);border:1px solid var(--ms-border);border-radius:8px;padding:10px;}',
    '#mines-solver .ms-title{color:var(--ms-gold);font-size:0.8em;font-weight:bold;letter-spacing:2px;text-transform:uppercase;',
    'margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--ms-border);}',
    // grid
    '#mines-solver .ms-gridbox{position:relative;border:2px solid var(--ms-border);border-radius:8px;overflow:hidden;background:#140e06;}',
    '#mines-solver .ms-bg{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0.55;pointer-events:none;}',
    '#mines-solver .ms-gridinner{position:relative;z-index:1;padding:8px;}',
    '#mines-solver .ms-row{display:grid;grid-template-columns:var(--ms-l) repeat(10,var(--ms-c));gap:2px;margin-bottom:2px;align-items:center;}',
    '#mines-solver .ms-label{text-align:center;font-size:0.8em;font-weight:bold;color:var(--ms-gold-light);text-shadow:0 1px 3px #000;}',
    '#mines-solver .ms-cell{width:var(--ms-c);height:var(--ms-c);background:rgba(20,14,6,0.45);border:1px solid rgba(74,56,32,0.7);',
    'border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;',
    'font-weight:bold;font-size:calc(var(--ms-c) * 0.4);color:var(--ms-text);user-select:none;transition:border-color .15s,transform .1s;}',
    '#mines-solver .ms-cell:hover{border-color:var(--ms-gold);transform:scale(1.05);z-index:2;}',
    '#mines-solver .ms-cell.selected{border-color:var(--ms-blue);background:#1a2040;}',
    '#mines-solver .ms-cell.far{background:rgba(32,14,14,0.82);border-color:#4a1a10;color:#a04030;}',
    '#mines-solver .ms-cell.far-old{background:#160808;border-color:#251208;color:#3a1a10;}',
    '#mines-solver .ms-cell.near{background:rgba(34,21,0,0.82);border-color:#5a3800;color:var(--ms-near);}',
    '#mines-solver .ms-cell.close{background:rgba(8,32,16,0.82);border-color:#205030;color:var(--ms-close);}',
    '#mines-solver .ms-cell.loot{background:#1a1400;border-color:var(--ms-gold);color:var(--ms-gold-light);}',
    '#mines-solver .ms-cell.best{border-color:var(--ms-blue);box-shadow:0 0 12px rgba(90,138,255,0.6);',
    'animation:ms-pulse 1.2s ease-in-out infinite;}',
    '@keyframes ms-pulse{0%,100%{box-shadow:0 0 8px rgba(90,138,255,0.5);}50%{box-shadow:0 0 20px rgba(90,138,255,0.9);}}',

        // pop-up menu next to a clicked cell
    '#mines-solver .ms-menu{position:absolute;z-index:5;display:flex;flex-direction:column;gap:3px;padding:5px;',
    'background:#0d0a06;border:1px solid var(--ms-gold);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.7);}',
    '#mines-solver .ms-menu[hidden]{display:none;}',
    '#mines-solver .ms-menu button{padding:4px 8px;font-size:0.85em;text-align:left;white-space:nowrap;}',

    '#mines-solver .ms-buttons{display:flex;flex-direction:column;gap:5px;}',
    '#mines-solver button{padding:6px 8px;border-radius:5px;border:1px solid;font:inherit;font-weight:bold;cursor:pointer;}',
    '#mines-solver .b-far{border-color:#4a1a10;background:#200e0e;color:#c04030;}',
    '#mines-solver .b-near{border-color:#5a3800;background:#221500;color:var(--ms-near);}',
    '#mines-solver .b-close{border-color:#205030;background:#082010;color:var(--ms-close);}',
    '#mines-solver .b-loot{border-color:var(--ms-gold);background:#1a1400;color:var(--ms-gold-light);}',
    '#mines-solver .b-clear{border-color:var(--ms-border);background:var(--ms-stone);color:var(--ms-dim);}',
    '#mines-solver .b-reset{border-color:#2a1060;background:#0e0820;color:#8060cc;}',
    '#mines-solver .b-reset.confirm{border-color:#cc4040;color:#ff6060;}',
    '#mines-solver .ms-sugg{border:1px solid var(--ms-blue);background:#0a0e1c;border-radius:6px;padding:10px;}',
    '#mines-solver .ms-sugg-move{font-size:1.6em;font-weight:bold;color:var(--ms-blue);}',
    '#mines-solver .ms-sugg-reason{font-size:0.8em;color:#7090dd;font-style:italic;}',
    // bottom row: legend, history, help
    '#mines-solver .ms-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px;}',
    '#mines-solver .ms-legend div{font-size:0.8em;margin:2px 0;}',
    '#mines-solver .ms-history{max-height:140px;overflow-y:auto;font-size:0.8em;}',
    '#mines-solver .ms-hist{display:flex;justify-content:space-between;padding:2px 6px;margin-bottom:2px;border-radius:3px;background:var(--ms-stone);}',
    '#mines-solver .ms-help{font-size:0.8em;color:var(--ms-dim);}'
  ].join('');

  // ---------- HTML ----------
  var RESULT_BUTTONS =

    '<button type="button" class="b-loot" data-mark="loot">★ Found Loot!</button>';

    '<button type="button" data-view="chance" title="% = chance the loot is in that cell">Loot chance</button>',

    '  </div>',
    '</div>',
    '<div class="ms-info">',

    '    <div style="color:var(--ms-close)">! Very Close — loot 1 step away</div>',
    '    <div style="color:var(--ms-near)">~ Near — loot exactly 2 steps away</div>',
    '    <div style="color:#c04030">✗ Too Far — loot more than 2 steps away</div>',
    '    <div style="color:var(--ms-gold-light)">★ Loot found</div>',
    '    <div class="ms-leg-chance" style="color:var(--ms-blue)">% = chance the loot is in that cell</div>',
    '    <div class="ms-leg-chance">Empty cell = the loot can\'t be there</div>',
    '    <div class="ms-leg-value" style="color:var(--ms-blue)">% = how many of the possible spots a dig there rules out on average</div>',
    '    <div class="ms-leg-value" style="color:#a03030">Red % = loot can\'t be there (but digging still tells you something)</div>',
    '  </div>',
    '  <div class="ms-panel"><div class="ms-title">History</div><div class="ms-history"></div></div>',
    '  <div class="ms-panel ms-help"><div class="ms-title">How to use</div>',
    '    1. Dig the suggested cell in-game.<br>2. Click that cell here and pick what the game said.<br>',
    '    3. Repeat until you find the loot. Steps are counted like a king in chess: a diagonal step counts as 1.',
    '  </div>',
    '</div>'
  ].join('\n');

  // ---------- Setup ----------
  function init(root) {
    if (!root || root.getAttribute('data-ms-loaded')) return;
    root.setAttribute('data-ms-loaded', '1');

    if (!document.getElementById('mines-solver-style')) {
      var style = document.createElement('style');
      style.id = 'mines-solver-style';
      style.appendChild(document.createTextNode(CSS));
      document.head.appendChild(style);
    }
    root.innerHTML = HTML;

    function $(sel) { return root.querySelector(sel); }

    var bg = root.getAttribute('data-bg');
    var bgEl = $('.ms-bg');
    if (bg) bgEl.style.backgroundImage = 'url("' + bg.replace(/"/g, '') + '")';

    // ---------- State ----------
    // cellState: null | 'far' | 'near' | 'close' | 'loot' | 'far-old'
    // 'far-old' = dug in an earlier round (dug cells are gone).
    var cellState = [];
    var r, c;
    for (r = 0; r < ROWS; r++) {
      cellState.push([]);
      for (c = 0; c < COLS; c++) cellState[r].push(null);
    }
    var completedRounds = [];
    var currentRound = [];
    var lootCount = 0;
    var selected = null;

    // Which percentages to show: 'chance' or 'value'. Remembered per browser
    // (wrapped in try/catch because storage can be blocked).
    var view = 'chance';
    try { if (window.localStorage.getItem('minesSolverView') === 'value') view = 'value'; } catch (err) {}

    // ---------- Grid ----------
    var grid = $('.ms-grid');
    var cellEls = [];
    var head = document.createElement('div');
    head.className = 'ms-row';
    head.appendChild(document.createElement('span'));
    for (c = 0; c < COLS; c++) {
      var h = document.createElement('span');
      h.className = 'ms-label';
      h.textContent = COL_LABELS.charAt(c);
      head.appendChild(h);
    }
    grid.appendChild(head);
    for (r = 0; r < ROWS; r++) {
      var rowEl = document.createElement('div');
      rowEl.className = 'ms-row';
      var lbl = document.createElement('span');
      lbl.className = 'ms-label';
      lbl.textContent = String(r + 1);
      rowEl.appendChild(lbl);
      cellEls.push([]);
      for (c = 0; c < COLS; c++) {
        var cell = document.createElement('div');
        cell.className = 'ms-cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        rowEl.appendChild(cell);
        cellEls[r].push(cell);
      }
      grid.appendChild(rowEl);
    }
    // One click listener for the whole grid (event delegation)
    grid.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== grid && !t.getAttribute('data-r')) t = t.parentNode;
      if (!t || t === grid) return;
      var rr = +t.getAttribute('data-r'), cc = +t.getAttribute('data-c');
      selectCell(rr, cc);
      openMenu(rr, cc);
    });

    // Result buttons: in the side column and in the pop-up menu
    // The handlers are made once, outside the loops, and shared by all buttons
    function onMarkClick(e) {
      closeMenu();
      markSelected(e.currentTarget.getAttribute('data-mark'));
    }
    function onClearClick() {
      closeMenu();
      resetCell();
    }
    var marks = root.querySelectorAll('[data-mark]');
    for (var i = 0; i < marks.length; i++) marks[i].addEventListener('click', onMarkClick);
    var clears = root.querySelectorAll('.b-clear');
    for (i = 0; i < clears.length; i++) clears[i].addEventListener('click', onClearClick);
    $('.b-reset').addEventListener('click', resetBoard);

    function onViewClick(e) {
      view = e.currentTarget.getAttribute('data-view');
      try { window.localStorage.setItem('minesSolverView', view); } catch (err) {}
      render(false);
    }
    var viewButtons = root.querySelectorAll('[data-view]');
    for (i = 0; i < viewButtons.length; i++) viewButtons[i].addEventListener('click', onViewClick);

    // ---------- Pop-up menu next to a cell ----------
    var menu = $('.ms-menu');
    var gridBox = $('.ms-gridbox');

    function openMenu(rr, cc) {
      if (cellState[rr][cc] === 'loot') { closeMenu(); return; }
      // "Clear" only makes sense for a result from this round
      var inCurrent = currentRound.some(function (h) { return h.r === rr && h.c === cc; });
      $('.ms-menu-clear').style.display = inCurrent ? '' : 'none';
      menu.hidden = false;
      var box = gridBox.getBoundingClientRect();
      var cellBox = cellEls[rr][cc].getBoundingClientRect();
      var w = menu.offsetWidth, h = menu.offsetHeight;
      // Right of the cell; if it doesn't fit, left of it
      var left = cellBox.right - box.left + 4;
      if (left + w > box.width) left = cellBox.left - box.left - w - 4;
      var top = cellBox.top - box.top;
      if (top + h > box.height) top = Math.max(0, box.height - h);
      menu.style.left = Math.max(0, left) + 'px';
      menu.style.top = top + 'px';
    }

    function closeMenu() { menu.hidden = true; }

    // Close the menu when clicking anywhere else, or with Escape
    document.addEventListener('click', function (e) {
      if (menu.hidden) return;
      if (!root.contains(e.target) || (!menu.contains(e.target) && !grid.contains(e.target))) closeMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.keyCode === 27) closeMenu();
    });

    // ---------- Size: cells grow with the available width ----------
    // Side by side if the cells can stay at least MIN_SIDE_CELL px,
    // otherwise the side column goes under the grid.
    var mainEl = $('.ms-main');
    var lastWidth = -1;

    function cellSizeFor(width) {
      // grid width = 8+8 padding + 4 border + label (0.6 cell) + 10 cells + 10 gaps of 2px
      return Math.floor((width - 40) / 10.6);
    }

    function layout() {
      var inner = root.clientWidth - 28; // minus padding of the tool
      if (inner === lastWidth || inner <= 0) return;
      lastWidth = inner;
      var side = cellSizeFor(inner - SIDE_WIDTH - 14);
      var stacked = side < MIN_SIDE_CELL;
      var c = Math.min(MAX_CELL, stacked ? cellSizeFor(inner) : side);
      c = Math.max(28, c);
      mainEl.className = 'ms-main' + (stacked ? ' stacked' : '');
      root.style.setProperty('--ms-c', c + 'px');
      root.style.setProperty('--ms-l', Math.round(c * 0.6) + 'px');
      if (stacked) $('.ms-side').style.maxWidth = gridBox.offsetWidth + 'px';
      else $('.ms-side').style.maxWidth = '';
      placeBackground(c);
      closeMenu();
    }

    // The picture is a screenshot of the in-game grid; scale and move it so
    // its squares line up with our cells. At 44px cells it was 839x387 and
    // the first cell sat at (212, 44) in the picture.
    function placeBackground(c) {
      var scale = (c + 2) / 46;
      var box = gridBox.getBoundingClientRect();
      var first = cellEls[0][0].getBoundingClientRect();
      var x = first.left - box.left - 2 - 212 * scale;
      var y = first.top - box.top - 2 - 44 * scale;
      bgEl.style.backgroundSize = Math.round(839 * scale) + 'px ' + Math.round(387 * scale) + 'px';
      bgEl.style.backgroundPosition = Math.round(x) + 'px ' + Math.round(y) + 'px';
    }

    if (window.ResizeObserver) {
      new ResizeObserver(function () { layout(); }).observe(root);
    } else {
      window.addEventListener('resize', layout);
    }

    // ---------- Actions ----------
    function addr(rr, cc) { return COL_LABELS.charAt(cc) + (rr + 1); }

    function sameCell(rr, cc) { return function (h) { return !(h.r === rr && h.c === cc); }; }

    function selectCell(rr, cc) {
      selected = {r: rr, c: cc};
      render(false);
    }

    function markSelected(status) {
      if (!selected) return;
      var rr = selected.r, cc = selected.c;
      if (cellState[rr][cc] === 'loot') return;
      cellState[rr][cc] = status;
      // A second answer for the same cell replaces the first (mis-click)
      currentRound = currentRound.filter(sameCell(rr, cc));
      currentRound.push({r: rr, c: cc, status: status});
      if (status === 'loot') {
        lootCount++;
        completedRounds.push(currentRound.slice());
        currentRound = [];
        startNewRound();
      }
      render(true);
    }

    function startNewRound() {
      var a, b, k, j;
      for (a = 0; a < ROWS; a++)
        for (b = 0; b < COLS; b++)
          if (cellState[a][b] !== 'loot') cellState[a][b] = null;
      for (k = 0; k < completedRounds.length; k++)
        for (j = 0; j < completedRounds[k].length; j++) {
          var p = completedRounds[k][j];
          if (cellState[p.r][p.c] !== 'loot') cellState[p.r][p.c] = 'far-old';
        }
    }

    function resetCell() {
      if (!selected) return;
      var rr = selected.r, cc = selected.c;
      if (cellState[rr][cc] === 'loot') return;
      var inCurrent = currentRound.some(function (h) { return h.r === rr && h.c === cc; });
      if (!inCurrent) return; // cells from earlier rounds stay dug
      currentRound = currentRound.filter(sameCell(rr, cc));
      var dugEarlier = completedRounds.some(function (rd) {
        return rd.some(function (p) { return p.r === rr && p.c === cc; });
      });
      cellState[rr][cc] = dugEarlier ? 'far-old' : null;
      render(false);
    }

    var resetTimer = null;
    function resetBoard() {
      var btn = $('.b-reset');
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = '⚠ Confirm reset?';
        resetTimer = setTimeout(function () {
          btn.classList.remove('confirm');
          btn.textContent = '🔄 Reset Board';
        }, 3000);
        return;
      }
      clearTimeout(resetTimer);
      btn.classList.remove('confirm');
      btn.textContent = '🔄 Reset Board';
      for (var a = 0; a < ROWS; a++)
        for (var b = 0; b < COLS; b++) cellState[a][b] = null;
      completedRounds = [];
      currentRound = [];
      lootCount = 0;
      selected = null;
      render(true);
    }

    // ---------- Solver ----------
    function cheby(r1, c1, r2, c2) { return Math.max(Math.abs(r1 - r2), Math.abs(c1 - c2)); }

    // Can the loot be at (lr, lc), given this round's answers?
    function isConsistentLootAt(lr, lc) {
      if (cellState[lr][lc] !== null) return false;
      for (var k = 0; k < currentRound.length; k++) {
        var p = currentRound[k];
        var d = cheby(p.r, p.c, lr, lc);
        if (p.status === 'far' && d <= 2) return false;
        if (p.status === 'near' && d !== 2) return false;
        if (p.status === 'close' && d !== 1) return false;
      }
      return true;
    }

    function getCandidates() {
      var list = [];
      for (var a = 0; a < ROWS; a++)
        for (var b = 0; b < COLS; b++)
          if (isConsistentLootAt(a, b)) list.push({r: a, c: b});
      return list;
    }

    function canDig(a, b) { return cellState[a][b] === null; }

    // Group the candidates by the answer this dig would give.
    // Expected spots left = sum(group size^2) / N.
    function evaluateDig(pr, pc, cands) {
      var close = 0, near = 0, far = 0, hit = 0;
      for (var k = 0; k < cands.length; k++) {
        var d = cheby(pr, pc, cands[k].r, cands[k].c);
        if (d === 0) hit++;
        else if (d === 1) close++;
        else if (d === 2) near++;
        else far++;
      }
      var n = cands.length;
      return {expLeft: n ? (close * close + near * near + far * far) / n : 0, hit: hit, n: n};
    }

    // Dig value: share of the possible spots a dig here rules out on average
    function cellScore(pr, pc, cands) {
      if (!canDig(pr, pc) || cands.length === 0) return 0;
      var e = evaluateDig(pr, pc, cands);
      return Math.round(100 * (1 - e.expLeft / e.n));
    }

    // The TOP_K digs that split the candidates best (skipping cells in `dug`).
    function topDigs(cands, dug, withLootCells) {
      var list = [];
      for (var a = 0; a < ROWS; a++)
        for (var b = 0; b < COLS; b++) {
          if (!canDig(a, b) || dug[a * COLS + b]) continue;
          var e = evaluateDig(a, b, cands);
          list.push({r: a, c: b, hit: e.hit, rank: e.expLeft - (e.hit ? 1e-6 : 0)});
        }
      list.sort(function (x, y) { return x.rank - y.rank; });
      var top = list.slice(0, TOP_K);
      // Also the best few cells where the loot can be, so they can win a tie
      // even if they look slightly worse one step ahead
      if (withLootCells) {
        var added = 0;
        for (var k = TOP_K; k < list.length && added < 3; k++) {
          if (list[k].hit) { top.push(list[k]); added++; }
        }
      }
      return top;
    }

    // Average digs needed if we dig p now and play well afterwards.
    function digsAfter(p, cands, dug, memo) {
      var groups = [[], [], []]; // close, near, far
      for (var k = 0; k < cands.length; k++) {
        var d = cheby(p.r, p.c, cands[k].r, cands[k].c);
        if (d === 1) groups[0].push(cands[k]);
        else if (d === 2) groups[1].push(cands[k]);
        else if (d > 2) groups[2].push(cands[k]);
      }
      var nextDug = {};
      for (var key in dug) if (dug.hasOwnProperty(key)) nextDug[key] = true;
      nextDug[p.r * COLS + p.c] = true;
      var total = 1;
      for (var g = 0; g < 3; g++)
        if (groups[g].length) total += (groups[g].length / cands.length) * expectedDigs(groups[g], nextDug, memo);
      return total;
    }

    // Average digs still needed when the loot is one of `cands`.
    function expectedDigs(cands, dug, memo) {
      if (cands.length === 1) return 1;
      var key = cands.map(function (p) { return p.r * COLS + p.c; }).join(',');
      if (memo.hasOwnProperty(key)) return memo[key];
      var best = Infinity, options = topDigs(cands, dug);
      for (var k = 0; k < options.length; k++)
        best = Math.min(best, digsAfter(options[k], cands, dug, memo));
      memo[key] = best;
      return best;
    }

    function bestDig(cands) {
      if (cands.length === 0) return null;
      var memo = {}, best = null, options = topDigs(cands, {}, true);
      for (var k = 0; k < options.length; k++) {
        var p = options[k];
        var digs = digsAfter(p, cands, {}, memo);
        var e = evaluateDig(p.r, p.c, cands);
        // Fewer digs wins. On a tie, prefer a cell where the loot can be:
        // same average, but a chance to find it right away.
        var tie = best && Math.abs(digs - best.digs) < 1e-9;
        if (!best || digs < best.digs - 1e-9 || (tie && e.hit > best.hit)) {
          best = {r: p.r, c: p.c, digs: digs, hit: e.hit, n: e.n};
        }
      }
      return best;
    }

    // ---------- Drawing ----------
    var SYMBOL = {far: '✗', 'far-old': '✗', near: '~', close: '!', loot: '★'};
    var LABEL = {far: 'Too Far', near: 'Near', close: 'Very Close', loot: 'Loot! ★'};
    var COLOR = {far: '#c04030', near: 'var(--ms-near)', close: 'var(--ms-close)', loot: 'var(--ms-gold-light)'};

    // moveSelection: after recording a result, jump to the suggested dig
    function render(moveSelection) {
      var cands = getCandidates();
      var best = bestDig(cands);
      if (moveSelection && best) selected = {r: best.r, c: best.c};

      for (var a = 0; a < ROWS; a++)
        for (var b = 0; b < COLS; b++) {
          var el = cellEls[a][b], st = cellState[a][b];
          el.className = 'ms-cell' + (st ? ' ' + st : '');
          el.textContent = st ? SYMBOL[st] : '';
          el.title = '';
          if (selected && selected.r === a && selected.c === b) el.className += ' selected';
          if (best && best.r === a && best.c === b) el.className += ' best';
          if (st === null && cands.length > 0) {
            var possible = isConsistentLootAt(a, b);
            var prob = null;
            if (view === 'chance' && possible) {
              // chance the loot is here (all remaining spots are equally likely)
              prob = document.createElement('span');
              prob.className = 'ms-prob';
              prob.textContent = Math.round(100 / cands.length) + '%';
              el.title = 'The loot can be here';
            } else if (view === 'value') {
              prob = document.createElement('span');
              prob.className = 'ms-prob' + (possible ? '' : ' no-loot');
              prob.textContent = cellScore(a, b, cands) + '%';
              el.title = possible ? 'The loot can be here' : 'No loot possible here (digging still gives information)';
            }
            if (prob) el.appendChild(prob);
          }
        }

      var k2, vb = root.querySelectorAll('[data-view]');
      for (k2 = 0; k2 < vb.length; k2++)
        vb[k2].className = vb[k2].getAttribute('data-view') === view ? 'active' : '';
      var legC = root.querySelectorAll('.ms-leg-chance'), legV = root.querySelectorAll('.ms-leg-value');
      for (k2 = 0; k2 < legC.length; k2++) legC[k2].style.display = view === 'chance' ? '' : 'none';
      for (k2 = 0; k2 < legV.length; k2++) legV[k2].style.display = view === 'value' ? '' : 'none';

      $('.ms-addr').textContent = selected ? addr(selected.r, selected.c) : '— click a cell —';
      $('.ms-loot-count').textContent = String(lootCount);

      // Suggestion
      var reason;
      if (!best) {
        $('.ms-sugg-move').textContent = '—';
        reason = cands.length === 0 ?
          'No spot fits all answers — check for a mis-click (Clear Cell)' :
          'No moves available';
      } else {
        $('.ms-sugg-move').textContent = addr(best.r, best.c);
        if (best.n === 1) {
          reason = 'Only one spot left: the loot is here';
        } else {
          reason = best.n + ' possible spots — about ' + best.digs.toFixed(1) +
                   ' digs to go on average, including this one';
          if (best.hit === 0) reason += ". The loot can't be here, but this dig narrows it down best";
        }
        if (currentRound.length === 0) reason = 'Round ' + (completedRounds.length + 1) + ' — ' + reason;
      }
      $('.ms-sugg-reason').textContent = reason;

      // History (newest first)
      var hist = $('.ms-history');
      hist.innerHTML = '';
      var all = [], k, j;
      for (k = 0; k < completedRounds.length; k++)
        for (j = 0; j < completedRounds[k].length; j++) all.push({p: completedRounds[k][j], round: k + 1});
      for (j = 0; j < currentRound.length; j++) all.push({p: currentRound[j], round: completedRounds.length + 1});
      if (!all.length) {
        hist.textContent = 'No digs yet';
      }
      for (k = all.length - 1; k >= 0; k--) {
        var row = document.createElement('div');
        row.className = 'ms-hist';
        var s1 = document.createElement('span');
        s1.textContent = addr(all[k].p.r, all[k].p.c);
        var s2 = document.createElement('span');
        s2.textContent = 'R' + all[k].round;
        s2.style.color = 'var(--ms-dim)';
        var s3 = document.createElement('span');
        s3.textContent = LABEL[all[k].p.status];
        s3.style.color = COLOR[all[k].p.status];
        row.appendChild(s1); row.appendChild(s2); row.appendChild(s3);
        hist.appendChild(row);
      }
    }

    layout();
    render(true);
  }

  // ---------- Start ----------
  function start(container) {
    var el = container && container.querySelector ? container.querySelector('#mines-solver') : null;
    init(el || document.getElementById('mines-solver'));
  }
  if (window.mw && mw.hook) {
    // Runs on page load and again after an edit preview
    mw.hook('wikipage.content').add(function ($content) { start($content && $content[0]); });
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { start(document); });
  } else {
    start(document);
  }
})();

</script>
</body>
</html>
